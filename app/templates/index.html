<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distributed Voting</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .nodes { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .node { border: 1px solid #333; border-radius: 4px; padding: 1rem; cursor: pointer; flex: 0 0 120px; text-align: center; background-color: #f4f4f4; }
        .node:hover { background-color: #e0e0e0; }
        .node.slow { background-color: #ffe5e5; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th, td { border: 1px solid #333; padding: 0.5rem; text-align: center; }
        @media (max-width: 600px) {
            .node { flex: 0 0 45%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Voting Demo</h1>
        <p><a href="{{ url_for('main.home') }}">Back to menu</a></p>
        <p>Total votes recorded: <span id="counter">{{ value }}</span></p>
        <h2>Local counters</h2>
        <table>
            <thead>
                <tr><th>Node ID</th><th>Count</th></tr>
            </thead>
            <tbody>
                {% for nid, count in counts.items() %}
                <tr><td>Node {{ nid }}</td><td>{{ count }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="nodes">
            {% for node in nodes %}
            <div class="node" data-id="{{ node.id }}">Node {{ node.id }}</div>
            <div class="node slow" data-id="{{ node.id }}">Slow {{ node.id }}</div>
            {% endfor %}
        </div>
    </div>
    <script>
        document.querySelectorAll('.node').forEach(function(el) {
            el.addEventListener('click', function() {
                var url = '/vote/' + el.dataset.id;
                if (el.classList.contains('slow')) {
                    url = '/slow_vote/' + el.dataset.id;
                }
                fetch(url, {method: 'POST'})
                    .finally(function() { window.location.reload(); });
            });
        });
    </script>
</body>
</html>
