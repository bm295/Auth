<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distributed Counter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .nodes { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .node { border: 1px solid #333; border-radius: 4px; padding: 1rem; cursor: pointer; flex: 0 0 120px; text-align: center; background-color: #f4f4f4; }
        .node:hover { background-color: #e0e0e0; }
        @media (max-width: 600px) {
            .node { flex: 0 0 45%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Distributed Counter</h1>
        <p>Current value: <span id="counter">{{ value }}</span></p>
        <div class="nodes">
            {% for node in nodes %}
            <div class="node" data-node="{{ loop.index }}">{{ node }}</div>
            {% endfor %}
        </div>
    </div>
    <script>
        document.querySelectorAll('.node').forEach(function(el) {
            el.addEventListener('click', function() {
                fetch('{{ url_for('main.increment') }}', {method: 'POST'})
                    .then(function() { window.location.reload(); });
            });
        });
    </script>
</body>
</html>
