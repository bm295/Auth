<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distributed Voting</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .nodes { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .node { border: 1px solid #333; border-radius: 4px; padding: 1rem; cursor: pointer; flex: 0 0 120px; text-align: center; background-color: #f4f4f4; }
        .node:hover { background-color: #e0e0e0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th, td { border: 1px solid #333; padding: 0.5rem; text-align: center; }
        @media (max-width: 600px) {
            .node { flex: 0 0 45%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Distributed Voting Demo</h1>
        <p>Total votes recorded: <span id="counter">{{ value }}</span></p>
        <h2>Local counters</h2>
        <table>
            <thead>
                <tr><th>Node ID</th><th>Count</th></tr>
            </thead>
            <tbody>
                {% for nid, count in counts.items() %}
                <tr><td>{{ nid }}</td><td>{{ count }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="nodes">
            {% for node in nodes %}
            <div class="node" data-node="{{ loop.index }}">{{ node }}</div>
            {% endfor %}
        </div>
    </div>
    <script>
        document.querySelectorAll('.node').forEach(function(el) {
            el.addEventListener('click', function() {
                fetch('{{ url_for('main.vote') }}', {method: 'POST'})
                    .then(function() { window.location.reload(); });
            });
        });
    </script>
</body>
</html>
